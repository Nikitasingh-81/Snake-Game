<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEON SNAKE // 2026</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at center, #0a0a1f 0%, #02020a 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', 'Consolas', monospace;
    color: #0ff;
    overflow: hidden;
    user-select: none;
  }
  .title {
    font-size: 34px;
    letter-spacing: 10px;
    color: #ff2bd6;
    text-shadow: 0 0 10px #ff2bd6, 0 0 25px #ff2bd6, 0 0 45px rgba(255,43,214,0.5);
    margin-bottom: 14px;
    font-weight: bold;
  }
  .wrap { position: relative; }
  canvas {
    display: block;
    background: #05050f;
    border: 2px solid #0ff;
    box-shadow: 0 0 25px #0ff, 0 0 60px rgba(0,255,255,0.4), inset 0 0 30px rgba(0,255,255,0.15);
  }
  .score {
    position: absolute;
    top: 12px;
    left: 16px;
    font-size: 20px;
    color: #0ff;
    text-shadow: 0 0 8px #0ff, 0 0 18px #0ff;
    letter-spacing: 3px;
    pointer-events: none;
  }
  .hi {
    position: absolute;
    top: 12px;
    right: 16px;
    font-size: 16px;
    color: #39ff14;
    text-shadow: 0 0 8px #39ff14;
    letter-spacing: 2px;
    pointer-events: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(5,5,15,0.82);
    backdrop-filter: blur(4px);
  }
  .overlay.show { display: flex; }
  .overlay h1 {
    font-size: 58px;
    margin: 0 0 18px;
    color: #ff2bd6;
    text-shadow: 0 0 15px #ff2bd6, 0 0 35px #ff2bd6, 0 0 60px rgba(255,43,214,0.6);
    letter-spacing: 8px;
    font-weight: bold;
  }
  .overlay p {
    font-size: 22px;
    color: #0ff;
    text-shadow: 0 0 10px #0ff;
    margin: 6px 0;
    letter-spacing: 3px;
  }
  .hint {
    margin-top: 22px;
    font-size: 14px;
    color: #39ff14;
    text-shadow: 0 0 8px #39ff14;
    letter-spacing: 3px;
    animation: blink 1.1s infinite;
  }
  @keyframes blink { 50% { opacity: 0.25; } }
  .controls {
    margin-top: 14px;
    font-size: 12px;
    color: rgba(0,255,255,0.55);
    letter-spacing: 2px;
  }
</style>
</head>
<body>
  <div class="title">NEON SNAKE</div>
  <div class="wrap">
    <canvas id="game" width="500" height="500"></canvas>
    <div class="score">SCORE <span id="score">0000</span></div>
    <div class="hi">HI <span id="hi">0000</span></div>
    <div class="overlay" id="overlay">
      <h1>GAME OVER</h1>
      <p>FINAL SCORE: <span id="finalScore">0</span></p>
      <p class="hint">[ PRESS SPACE TO REBOOT ]</p>
    </div>
  </div>
  <div class="controls">ARROWS / WASD — MOVE &nbsp;•&nbsp; SPACE — RESTART</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const hiEl = document.getElementById('hi');
  const finalScoreEl = document.getElementById('finalScore');
  const overlay = document.getElementById('overlay');

  const CELL = 20;
  const COLS = canvas.width / CELL;   // 25
  const ROWS = canvas.height / CELL;  // 25
  const TICK_MS = 110;

  let snake, dir, nextDir, food, score, hi, gameOver, lastTick, particles;

  function pad(n) { return String(n).padStart(4, '0'); }

  function reset() {
    snake = [
      { x: 12, y: 12 },
      { x: 11, y: 12 },
      { x: 10, y: 12 }
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    gameOver = false;
    particles = [];
    placeFood();
    scoreEl.textContent = pad(score);
    overlay.classList.remove('show');
    lastTick = performance.now();
  }

  function placeFood() {
    while (true) {
      const f = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS)
      };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) {
        food = f;
        return;
      }
    }
  }

  function spawnParticles(x, y) {
    const cx = x * CELL + CELL / 2;
    const cy = y * CELL + CELL / 2;
    for (let i = 0; i < 18; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 3;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1
      });
    }
  }

  function step() {
    // Apply queued direction only if it's not a 180° reversal
    if (!(nextDir.x === -dir.x && nextDir.y === -dir.y)) {
      dir = nextDir;
    }
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return endGame();
    if (snake.some(s => s.x === head.x && s.y === head.y)) return endGame();

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = pad(score);
      spawnParticles(food.x, food.y);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function endGame() {
    gameOver = true;
    if (score > hi) hi = score;
    hiEl.textContent = pad(hi);
    finalScoreEl.textContent = pad(score);
    overlay.classList.add('show');
  }

  function drawGrid() {
    ctx.strokeStyle = 'rgba(0,255,255,0.13)';
    ctx.lineWidth = 1;
    ctx.shadowBlur = 3;
    ctx.shadowColor = '#0ff';
    ctx.beginPath();
    for (let x = 0; x <= COLS; x++) {
      ctx.moveTo(x * CELL + 0.5, 0);
      ctx.lineTo(x * CELL + 0.5, canvas.height);
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.moveTo(0, y * CELL + 0.5);
      ctx.lineTo(canvas.width, y * CELL + 0.5);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  function drawFood(now) {
    const pulse = 0.55 + 0.45 * Math.sin(now / 180);
    const cx = food.x * CELL + CELL / 2;
    const cy = food.y * CELL + CELL / 2;

    // outer glow halo
    const grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, CELL * 1.6);
    grad.addColorStop(0, `rgba(57,255,20,${0.55 * pulse})`);
    grad.addColorStop(1, 'rgba(57,255,20,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(food.x * CELL - CELL, food.y * CELL - CELL, CELL * 3, CELL * 3);

    // core block
    ctx.shadowBlur = 22 * pulse;
    ctx.shadowColor = '#39ff14';
    ctx.fillStyle = '#39ff14';
    ctx.fillRect(food.x * CELL + 3, food.y * CELL + 3, CELL - 6, CELL - 6);

    // bright inner
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(220,255,200,${0.6 + 0.4 * pulse})`;
    ctx.fillRect(food.x * CELL + 7, food.y * CELL + 7, CELL - 14, CELL - 14);
  }

  function drawSnake() {
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const isHead = i === 0;
      const t = i / Math.max(1, snake.length - 1); // 0 head -> 1 tail

      // pink gradient head -> darker tail
      const r = 255;
      const g = Math.floor(43 + (1 - t) * 60);
      const b = Math.floor(214 - t * 60);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.shadowBlur = isHead ? 22 : 12 - t * 6;
      ctx.shadowColor = '#ff2bd6';

      const pad = isHead ? 0 : 1;
      ctx.fillRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2);

      // segment border accent
      if (!isHead) {
        ctx.shadowBlur = 0;
        ctx.strokeStyle = `rgba(255,180,240,${0.35 - t * 0.2})`;
        ctx.lineWidth = 1;
        ctx.strokeRect(s.x * CELL + 1.5, s.y * CELL + 1.5, CELL - 3, CELL - 3);
      }
    }
    ctx.shadowBlur = 0;

    // eyes on head
    const head = snake[0];
    const ex = head.x * CELL, ey = head.y * CELL;
    ctx.fillStyle = '#05050f';
    let e1, e2;
    if (dir.x === 1)       { e1 = [ex + 13, ey + 5];  e2 = [ex + 13, ey + 13]; }
    else if (dir.x === -1) { e1 = [ex + 4,  ey + 5];  e2 = [ex + 4,  ey + 13]; }
    else if (dir.y === 1)  { e1 = [ex + 5,  ey + 13]; e2 = [ex + 13, ey + 13]; }
    else                   { e1 = [ex + 5,  ey + 4];  e2 = [ex + 13, ey + 4];  }
    ctx.fillRect(e1[0], e1[1], 3, 3);
    ctx.fillRect(e2[0], e2[1], 3, 3);
  }

  function drawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.94;
      p.vy *= 0.94;
      p.life -= 0.035;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#39ff14';
      ctx.fillStyle = `rgba(57,255,20,${p.life})`;
      ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
    }
    ctx.shadowBlur = 0;
  }

  function drawScanlines() {
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    for (let y = 0; y < canvas.height; y += 3) {
      ctx.fillRect(0, y, canvas.width, 1);
    }
  }

  function draw(now) {
    // background
    ctx.fillStyle = '#05050f';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawGrid();
    drawFood(now);
    drawSnake();
    drawParticles();
    drawScanlines();
  }

  function loop(now) {
    if (!gameOver && now - lastTick >= TICK_MS) {
      step();
      lastTick = now;
    }
    draw(now);
    requestAnimationFrame(loop);
  }

  document.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowUp'    || k === 'w' || k === 'W') { nextDir = { x: 0, y: -1 }; e.preventDefault(); }
    else if (k === 'ArrowDown'  || k === 's' || k === 'S') { nextDir = { x: 0, y: 1  }; e.preventDefault(); }
    else if (k === 'ArrowLeft'  || k === 'a' || k === 'A') { nextDir = { x: -1, y: 0 }; e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { nextDir = { x: 1, y: 0  }; e.preventDefault(); }
    else if (k === ' ') {
      if (gameOver) reset();
      e.preventDefault();
    }
  });

  hi = 0;
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
